    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: #0f0e17;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* ===== Floating Particles ===== */
      .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        animation: drift var(--dur) ease-in-out infinite;
        animation-delay: var(--delay);
      }

      .particle:nth-child(1) {
        width: 6px;
        height: 6px;
        background: #7c3aed;
        top: 10%;
        left: 15%;
        --dur: 6s;
        --delay: 0s;
      }
      .particle:nth-child(2) {
        width: 4px;
        height: 4px;
        background: #a78bfa;
        top: 20%;
        left: 75%;
        --dur: 8s;
        --delay: 1s;
      }
      .particle:nth-child(3) {
        width: 8px;
        height: 8px;
        background: #67e8f9;
        top: 70%;
        left: 20%;
        --dur: 7s;
        --delay: 2s;
      }
      .particle:nth-child(4) {
        width: 5px;
        height: 5px;
        background: #f472b6;
        top: 80%;
        left: 80%;
        --dur: 9s;
        --delay: 0.5s;
      }
      .particle:nth-child(5) {
        width: 3px;
        height: 3px;
        background: #7c3aed;
        top: 50%;
        left: 50%;
        --dur: 5s;
        --delay: 3s;
      }
      .particle:nth-child(6) {
        width: 7px;
        height: 7px;
        background: #a3e635;
        top: 35%;
        left: 40%;
        --dur: 10s;
        --delay: 1.5s;
      }
      .particle:nth-child(7) {
        width: 4px;
        height: 4px;
        background: #f97316;
        top: 60%;
        left: 10%;
        --dur: 6.5s;
        --delay: 2.5s;
      }
      .particle:nth-child(8) {
        width: 5px;
        height: 5px;
        background: #67e8f9;
        top: 15%;
        left: 60%;
        --dur: 7.5s;
        --delay: 0.8s;
      }

      @keyframes drift {
        0%,
        100% {
          opacity: 0;
          transform: translateY(0) scale(0.5);
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 0.6;
        }
        50% {
          transform: translateY(-40px) scale(1);
        }
      }

      /* ===== Ambient Glow ===== */
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 0;
      }

      .glow-1 {
        width: 400px;
        height: 400px;
        background: rgba(124, 58, 237, 0.15);
        top: -100px;
        left: -100px;
        animation: pulse 8s ease-in-out infinite;
      }

      .glow-2 {
        width: 350px;
        height: 350px;
        background: rgba(103, 232, 249, 0.1);
        bottom: -100px;
        right: -100px;
        animation: pulse 10s ease-in-out infinite 2s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      /* ===== Main Card ===== */
      .card {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 60px 40px;
        max-width: 520px;
        width: 90%;
      }

      /* ===== App Icon ===== */
      .app-icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border-radius: 24px;
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        animation: iconBounce 2s ease-in-out infinite;
      }

      @keyframes iconBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      /* ===== Tag ===== */
      .tag {
        display: inline-block;
        font-family: "Space Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        color: #67e8f9;
        background: rgba(103, 232, 249, 0.1);
        border: 1px solid rgba(103, 232, 249, 0.25);
        padding: 6px 14px;
        border-radius: 30px;
        margin-bottom: 24px;
        animation: tagPulse 3s ease-in-out infinite;
      }

      @keyframes tagPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(103, 232, 249, 0.3);
        }
        50% {
          box-shadow: 0 0 12px 2px rgba(103, 232, 249, 0.15);
        }
      }

      /* ===== Heading ===== */
      .card h1 {
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 16px;
        opacity: 0;
        animation: fadeUp 0.6s ease forwards 0.3s;
      }

      .card h1 .highlight {
        background: linear-gradient(135deg, #7c3aed, #a78bfa, #67e8f9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ===== Description ===== */
      .card p {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.7;
        max-width: 400px;
        margin: 0 auto 36px;
        opacity: 0;
        animation: fadeUp 0.6s ease forwards 0.5s;
      }

      /* ===== Redirect Button ===== */
      .btn-wrap {
        opacity: 0;
        animation: fadeUp 0.6s ease forwards 0.7s;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: #fff;
        font-family: "Poppins", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 14px 32px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #a78bfa, #7c3aed);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .btn:hover::before {
        opacity: 1;
      }

      .btn span,
      .btn .arrow {
        position: relative;
        z-index: 1;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
      }

      .arrow {
        font-size: 18px;
        transition: transform 0.3s ease;
      }

      .btn:hover .arrow {
        transform: translateX(4px);
      }

      /* ===== Auto-redirect bar ===== */
      .redirect-info {
        margin-top: 28px;
        opacity: 0;
        animation: fadeUp 0.6s ease forwards 0.9s;
      }

      .redirect-info p {
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.3);
        margin: 0 0 10px;
        animation: none;
        opacity: 1;
      }

      .progress-bar {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        margin: 0 auto;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7c3aed, #67e8f9);
        border-radius: 99px;
        transition: width 0.1s linear;
      }

      /* ===== Footer ===== */
      .footer-text {
        position: fixed;
        bottom: 24px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.18);
        z-index: 1;
      }

      .footer-text a {
        color: rgba(124, 167, 250, 0.5);
        text-decoration: none;
      }

      .footer-text a:hover {
        color: #a78bfa;
      }

      /* ===== Animations ===== */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== Responsive ===== */
      @media (max-width: 480px) {
        .card {
          padding: 40px 24px;
        }

        .card h1 {
          font-size: 1.8rem;
        }
      }
    </style>

  <body>
    <!-- Particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>

    <!-- Ambient Glow -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Main Card -->
    <div class="card">
      <!-- Change emoji per app: 🧪 Alomole | 📚 ClassNotes | ⏰ Tickly -->
      <div class="app-icon">📚</div>

      <div class="tag">We've Moved</div>

      <!-- Change app name in h1 -->
      <h1>Thanks for using <span class="highlight">ClassNotes</span></h1>

      <p>
        We're growing! To give you a better experience,
        <strong style="color: rgba(255, 255, 255, 0.75)">ClassNotes</strong> has
        moved to our new home. Support us by visiting the new link below 🚀
      </p>

      <!-- Change href to your new app URL -->
      <div class="btn-wrap">
        <a
          href="https://alokdasofficial.in/classnotes"
          class="btn"
          id="redirectBtn"
        >
          <span>Visit New Site</span>
          <span class="arrow">→</span>
        </a>
      </div>

      <!-- Auto-redirect progress bar -->
      <div class="redirect-info">
        <p>Auto-redirecting in <strong id="countdown">5</strong>s...</p>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      Built with ❤️ by
      <a href="https://alokdasofficial.in" target="_blank">Alok Das</a>
    </div>

    <script>
      // ===== CONFIG — Change these per app =====
      const REDIRECT_URL = "https://alokdasofficial.in/classnotes";
      const COUNTDOWN_SECONDS = 8;
      // ==========================================

      const countdown = document.getElementById("countdown");
      const progressFill = document.getElementById("progressFill");

      let remaining = COUNTDOWN_SECONDS;
      const interval = 100; // update every 100ms
      const totalSteps = (COUNTDOWN_SECONDS * 1000) / interval;
      let step = 0;

      const timer = setInterval(() => {
        step++;
        const percent = (step / totalSteps) * 100;
        progressFill.style.width = percent + "%";

        // Update countdown number every second
        const newRemaining = Math.ceil(
          COUNTDOWN_SECONDS - (step * interval) / 1000,
        );
        if (newRemaining !== remaining) {
          remaining = newRemaining;
          countdown.textContent = remaining;
        }

        // Redirect when done
        if (step >= totalSteps) {
          clearInterval(timer);
          window.location.href = REDIRECT_URL;
        }
      }, interval);
    </script>
